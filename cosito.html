        // Crear partículas decorativas

        function createParticles() {

            const particleCount = window.innerWidth < 600 ? 15 : 30;

            

            for (let i = 0; i < particleCount; i++) {

                const particle = document.createElement('div');

                particle.className = 'particle';

                

                // Tamaño aleatorio

                const size = Math.random() * 15 + 5;

                particle.style.width = size + 'px';

                particle.style.height = size + 'px';

                

                // Posición aleatoria

                particle.style.left = Math.random() * 100 + '%';

                particle.style.bottom = -size + 'px';

                

                // Velocidad y retraso aleatorios

                const duration = Math.random() * 20 + 10;

                const delay = Math.random() * 10;

                particle.style.animation = `particleFloat ${duration}s infinite linear ${delay}s`;

                

                particlesContainer.appendChild(particle);

            }

        }

                    storyTextElement.innerHTML += '<br>';

                } else {

                    storyTextElement.innerHTML += char;

                }

                

                // Scroll al final del texto para ver lo que se está escribiendo

                storyTextElement.scrollTop = storyTextElement.scrollHeight;

                

                // Velocidad aleatoria para simular mecanografía natural

                const randomDelay = typingSpeed + Math.random() * 50;

                

                setTimeout(function() {

                    typeText(text, index + 1, callback);

                }, randomDelay);

            } else {

                if (callback) callback();

            }

        }

        // Iniciar la historia al hacer clic en el botón de comenzar
        startButton.addEventListener('click', function() {
            startScreen.classList.add('hidden');
            storyContainer.classList.remove('hidden');
            storyContainer.classList.add('fade-in');
            loadScene(currentScene);
        });

        // Cargar escena
        function loadScene(sceneId) {
            // Si es restart, volver al inicio
            if (sceneId === 'restart') {
                currentScene = 'start';
                startScreen.classList.remove('hidden');
                storyContainer.classList.add('hidden');
                return;
            }

            const scene = story[sceneId];
            currentScene = sceneId;
            
            // Actualizar título y fecha
            titleElement.textContent = scene.title;
            dateElement.textContent = scene.date;
            
            // Actualizar barra de progreso
            progressBar.style.width = scene.progress + '%';
            
            // Limpiar texto y opciones
            storyTextElement.innerHTML = '';
            optionsElement.innerHTML = '';
            
            // Efecto de escribir texto
            typeText(scene.text, 0, function() {
                // Crear botones de opciones después de terminar de escribir
                scene.options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'option-btn fade-in';
                    button.textContent = option.text;
                    
                    // Si es la última escena, añadir clase especial
                    if (sceneId === 'mensaje_final') {
                        button.classList.add('restart-btn');
                    }
                    
                    button.addEventListener('click', function() {
                        storyContainer.classList.remove('slide-in');
                        void storyContainer.offsetWidth; // Forzar reflow
                        storyContainer.classList.add('slide-in');
                        loadScene(option.next);
                    });
                    
                    optionsElement.appendChild(button);
                });
                
                // Añadir mensaje especial si es la escena final
                if (sceneId === 'mensaje_final') {
                    const finalMessage = document.createElement('div');
                    finalMessage.className = 'final-message fade-in';
                    finalMessage.innerHTML = 'Feliz <span class="heartbeat">❤️</span> mesiversario, mi amor';
                    storyContainer.appendChild(finalMessage);
                }
            });
        }

        // Cambiar velocidad de escritura según el dispositivo
        if (window.innerWidth < 600) {
            typingSpeed = 15; // Más rápido en móviles
        }

        // Crear partículas al cargar la página
        window.addEventListener('load', function() {
            createParticles();
            
            // Añadir elementos flotantes adicionales aleatoriamente
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const floating = document.createElement('div');
                    floating.className = 'floating ' + (Math.random() > 0.5 ? 'heart' : 'star');
                    floating.textContent = Math.random() > 0.5 ? '❤️' : '✨';
                    floating.style.top = Math.random() * 90 + 5 + '%';
                    floating.style.left = Math.random() * 90 + 5 + '%';
                    floating.style.animationDelay = Math.random() * 5 + 's';
                    document.body.appendChild(floating);
                }, i * 1000);
            }
            
            // Función para resaltar palabras clave en la historia
            const highlightKeywords = function() {
                const keywords = ['amor', 'corazón', 'Juli', 'Elian', 'pulsera', 'McDonald\'s', 'carta'];
                const nodes = storyTextElement.childNodes;
                
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].nodeType === 3) { // Nodo de texto
                        let text = nodes[i].nodeValue;
                        for (let keyword of keywords) {
                            const regex = new RegExp(`\\b${keyword}\\b`, 'gi');
                            text = text.replace(regex, `<span class="highlight">${keyword}</span>`);
                        }
                        
                        if (text !== nodes[i].nodeValue) {
                            const span = document.createElement('span');
                            span.innerHTML = text;
                            nodes[i].parentNode.replaceChild(span, nodes[i]);
                        }
                    }
                }
            };
        });
    </script>
</body>
</html>
